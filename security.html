<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access | Hisab Ledger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0c0e;
            --surface: #141517;
            --border: #232529;
            --accent: #ffffff;
            --text-muted: #8a8d91;
            --error: #ff4d4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: white;
            overflow: hidden;
        }

        /* Ambient background glow */
        .glow {
            position: absolute;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 380px;
            text-align: center;
            animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            margin-bottom: 2.5rem;
        }

        .vault-icon {
            display: inline-block;
            margin-bottom: 1rem;
            opacity: 0.8;
        }

        h1 {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .auth-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 40px 100px -20px rgba(0,0,0,0.5);
        }

        .input-wrapper {
            margin-bottom: 1.5rem;
            position: relative;
        }

        input {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border);
            padding: 0.875rem;
            border-radius: 6px;
            color: white;
            font-size: 0.875rem;
            text-align: center;
            letter-spacing: 0.3em;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #404245;
            box-shadow: 0 0 0 1px #404245;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0.875rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: scale(0.99);
        }

        #error-msg {
            font-size: 0.7rem;
            color: var(--error);
            margin-top: 1rem;
            display: none;
            font-weight: 500;
        }

        .footer-note {
            margin-top: 3rem;
            font-size: 0.65rem;
            color: #4a4d52;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }
    </style>
</head>
<body>
    <div class="glow"></div>

    <div class="login-container">
        <div class="logo-area">
            <div class="vault-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            </div>
            <h1>Restricted Access</h1>
            <p>Authentication required to access the financial ledger</p>
        </div>

        <div class="auth-box">
            <form onsubmit="handleAuth(event)">
                <div class="input-wrapper">
                    <input type="password" id="passcode" placeholder="ENTER PASSCODE" required autofocus>
                </div>
                <button type="submit" class="btn-submit">Verify Identity</button>
                <div id="error-msg">Invalid passcode. Access denied.</div>
            </form>
        </div>

        <p class="footer-note">Secure Terminal v3.0 // Hisab Ledger Systems</p>
    </div>

    <script>
        function handleAuth(e) {
            e.preventDefault();
            const input = document.getElementById('passcode').value;
            if (input === 'everyday26') {
                sessionStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'advanced_company_financial_analytics_and_accounting_dashboard_v1.html';
            } else {
                const err = document.getElementById('error-msg');
                err.style.display = 'block';
                document.getElementById('passcode').value = '';
                document.getElementById('passcode').focus();
            }
        }
    </script>
</body>
</html>
