<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - EverydayBD</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="https://drive.google.com/uc?id=1j4L79wO7-VvK_7f0vE8-x_xXz_x_x_x">
</head>
<body class="dark-mode" style="opacity: 0; transition: opacity 0.4s ease;">
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <img src="https://drive.google.com/uc?id=1N8j7Y_VvU6wz_x_x_x_x_x_x_x_x" alt="EverydayBD" class="logo-img">
                </a>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#shop">Shop</a>
                <a href="https://drive.google.com/file/d/1lgFbWq8K2A5nUXkdmm3Cp0pIx_owuO9_/view?usp=drive_link" 
                   target="_blank" rel="noopener noreferrer" class="nav-download-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M17.523 15.341l.83 5.039a.4.4 0 0 1-.393.465.402.402 0 0 1-.366-.239l-1.996-4.041a.398.398 0 0 1 .173-.521.402.402 0 0 1 .521.17l1.231 2.493-.572-3.473a1.4 1.4 0 0 1 .572-.293zM6.477 15.341l-.83 5.039a.4.4 0 0 0 .393.465.402.402 0 0 0 .366-.239l1.996-4.041a.398.398 0 0 0-.173-.521.402.402 0 0 0-.521.17l-1.231 2.493.572-3.473a1.4 1.4 0 0 0-.572-.293zM12 4.1a6.9 6.9 0 0 0-6.852 6.13h13.704A6.9 6.9 0 0 0 12 4.1zm-3.3 4.2a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8zm6.6 0a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8zM5.1 11.23a.4.4 0 0 0-.4.4v2.7a.4.4 0 0 0 .4.4h13.8a.4.4 0 0 0 .4-.4v-2.7a.4.4 0 0 0-.4-.4H5.1z"/>
                    </svg>
                    <span>App</span>
                </a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                    <svg id="theme-icon-dark" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg id="theme-icon-light" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" style="display:none;">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Profile Section -->
    <main class="profile-page">
        <div class="container">
            <div class="profile-card reveal active">
                <div class="profile-header">
                    <div id="p-avatar" class="p-avatar">U</div>
                    <h1 id="p-name">Loading...</h1>
                    <p id="p-email">Please wait while we fetch your details</p>
                </div>
                
                <div class="profile-details">
                    <div class="detail-item">
                        <span class="label">Account Status</span>
                        <span class="value">Verified</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Member Since</span>
                        <span class="value" id="p-joined">May 2026</span>
                    </div>
                </div>

                <div class="profile-actions">
                    <button id="p-logout-btn" class="btn-primary">Logout from Account</button>
                    <a href="index.html" class="btn-secondary">Go Back to Home</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="professional-footer">
        <div class="container footer-grid">
            <div class="footer-col brand-col">
                <img src="https://drive.google.com/uc?id=1N8j7Y_VvU6wz_x_x_x_x_x_x_x_x" alt="EverydayBD" class="footer-logo">
                <p>Premium Watches, Gadgets & Cosmetics.</p>
            </div>
            <div class="footer-col">
                <h4>Quick Links</h4>
                <a href="index.html">Home</a>
                <a href="index.html#shop">Shop</a>
            </div>
            <div class="footer-col">
                <h4>Customer Care</h4>
                <a href="mailto:everydaybdstore@gmail.com">Contact Us</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 EverydayBD. All rights reserved.</p>
        </div>
    </footer>

    <!-- Firebase Scripts -->
    <script type="module" src="profile.js"></script>
</body>
</html>
